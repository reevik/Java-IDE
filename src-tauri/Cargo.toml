[package]
name = "java-ade"
version = "0.2.0"
description = "Reevik Java ADE — a glossy Java IDE with an AI agent"
authors = ["Erhan Bağdemir"]
edition = "2021"

[lib]
name = "java_ade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.103"
keyring = { version = "4.1.4", features = ["apple-native-keyring-store"] }
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "rustls"], default-features = false }
window-vibrancy = "0.7.1"
toml = "0.9"
similar = "2"
